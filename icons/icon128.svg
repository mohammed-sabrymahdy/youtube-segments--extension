<svg width="128" height="128" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#0d0d10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7a5c"/>
      <stop offset="100%" style="stop-color:#e84c4c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Scissors / clip icon -->
  <!-- Circle 1 -->
  <circle cx="18" cy="22" r="6" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <!-- Circle 2 -->
  <circle cx="18" cy="42" r="6" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <!-- Blades -->
  <line x1="23" y1="20" x2="50" y2="38" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <line x1="23" y1="44" x2="50" y2="26" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <!-- Dot in center -->
  <circle cx="36" cy="32" r="2.5" fill="url(#accent)"/>
</svg>